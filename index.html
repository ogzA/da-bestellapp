<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestellapp</title>
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="variables.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="./db/db.js"></script>
    <script src="./scripts/template.js" defer></script>
    <script src="./script.js" defer></script>
    <script src="./scripts/confirmation.js" defer></script>
  </head>
  <body onload="render()">
    <header>
      <div class="container">
        <div class="header-content">
          <a href="#">
            <img class="logo" src="./assets/img/logo.png" alt="Lieferando" />
          </a>
          <nav>
            <img
              class="menu-icon"
              src="./assets/icons/burger-menu.svg"
              alt="Menu"
            />
          </nav>
        </div>
      </div>
    </header>
    <main>
      <section id="hero" class="hero">
        <div class="hero-banner">
          <img src="./assets/img/dishes/hero.avif" alt="" />
        </div>
        <div class="hero-content">
          <img
            class="hero-logo"
            src="./assets/img/dishes/burger-logo.avif"
            alt="BurgerHouse"
          />
          <div class="hero-heading">
            <h1 class="hero-title"><span>Burger</span>House</h1>
            <div class="hero-rating">
              <img src="./assets/icons/star.svg" alt="" />
              <span class="rating-value">4,1</span>
              <span class="rating-count">(317)</span>
            </div>
          </div>
          <p class="hero-subtitle">
            The best of Burgers, Pizza, and Greens, all in one great place.
          </p>
        </div>
      </section>
      <section id="basket-container" class="basket-container">
        <div class="container">
          <div id="cart" class="cart"></div>
        </div>
      </section>
      <section id="burgers">
        <div class="bar">
          <div class="container">
            <div class="bar-content">
              <img src="./assets/img/burger-img.png" alt="Burgers" />
              <h2>Burger & Sandwiches</h2>
            </div>
          </div>
        </div>
        <div class="container">
          <div id="burger-content" class="burger-content"></div>
        </div>
      </section>

      <section id="pizzas">
        <div class="bar">
          <div class="container">
            <div class="bar-content">
              <img src="./assets/img/pizza-img.png" alt="Burgers" />
              <h2>Pizzas</h2>
            </div>
          </div>
        </div>
        <div class="container">
          <div id="pizza-content" class="pizza-content"></div>
        </div>
      </section>

      <section id="salads">
        <div class="bar">
          <div class="container">
            <div class="bar-content">
              <img src="./assets/img/salad-img.png" alt="Burgers" />
              <h2>Salads</h2>
            </div>
          </div>
        </div>
        <div class="container">
          <div id="salad-content" class="salad-content"></div>
        </div>
      </section>
    </main>
    <footer>
      <a href="#">2026 BurgerHouse</a>
      <a href="#">Imprint</a>
      <a href="#">Cookie Preferences</a>
    </footer>

    <nav class="mobile-nav">
      <button class="mobile-nav-btn">
        <img class="mobile-nav-icon" src="./assets/icons/home.svg" alt="Home" />
      </button>
      <button class="mobile-nav-btn">
        <img
          class="mobile-nav-icon"
          src="./assets/icons/person.svg"
          alt="Profile"
        />
      </button>
      <button class="mobile-nav-btn">
        <img
          class="mobile-nav-icon"
          src="./assets/icons/dining.svg"
          alt="Orders"
        />
      </button>
      <button class="mobile-nav-btn" onclick="openCart()">
        <img
          class="mobile-nav-icon"
          src="./assets/icons/shopping_cart.svg"
          alt="Basket"
        />
        <span id="basket-badge" class="basket-badge d-none">0</span>
      </button>
    </nav>

    <dialog id="confirmation" class="confirmation"></dialog>
  </body>
</html>
