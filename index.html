<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestellapp</title>
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="variables.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="./db/db.js"></script>
    <script src="./scripts/template.js"></script>
    <script src="./script.js" defer></script>
    <script src="./scripts/confirmation.js" defer></script>
  </head>
  <body onload="render()">
    <header>
      <div class="container">
        <div class="header-content">
          <a href="#">
            <img class="logo" src="./assets/img/logo.png" alt="Lieferando" />
          </a>
          <nav>
            <img
              class="menu-icon"
              src="./assets/icons/burger-menu.svg"
              alt="Menu"
            />
          </nav>
        </div>
      </div>
    </header>
    <main>
      <section>Hero</section>
      <section id="basket-container" class="basket-container">
        <div class="container">
          <div id="cart">
            <div id="basket"></div>
            <div id="basket-total-price"></div>
          </div>
        </div>
      </section>
      <section id="burgers">
        <div class="bar">
          <div class="container">
            <div class="bar-content">
              <img src="./assets/img/burger-img.png" alt="Burgers" />
              <h2>Burger & Sandwiches</h2>
            </div>
          </div>
        </div>
        <div class="container">
          <div id="burger-content"></div>
        </div>
      </section>

      <section id="pizzas">
        <div class="bar">
          <div class="container">
            <div class="bar-content">
              <img src="./assets/img/pizza-img.png" alt="Burgers" />
              <h2>Pizzas</h2>
            </div>
          </div>
        </div>
        <div class="container">
          <div id="pizza-content"></div>
        </div>
      </section>

      <section id="salads">
        <div class="bar">
          <div class="container">
            <div class="bar-content">
              <img src="./assets/img/salad-img.png" alt="Burgers" />
              <h2>Salads</h2>
            </div>
          </div>
        </div>
        <div class="container">
          <div id="salad-content"></div>
        </div>
      </section>
    </main>
    <footer>
      <a href="#">2026 BurgerHouse</a>
      <a href="#">Imprint</a>
      <a href="#">Cookie Preferences</a>
    </footer>
  </body>
</html>
